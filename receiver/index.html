<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Muslim Quran Receiver</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    :root { color-scheme: dark; font-family: "Noto Naskh Arabic", "Noto Sans", sans-serif; background: #071710; color: #f5f1df; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 0, #173c2d, #071710 72%); }
    main { min-height: 100vh; display: grid; grid-template-rows: 1fr auto; padding: clamp(24px, 5vw, 72px); gap: 32px; }
    .reading { align-self: center; width: min(100%, 1500px); margin: auto; text-align: center; }
    .identity { display: flex; justify-content: center; align-items: center; gap: 16px; color: #c7bd8f; font-size: clamp(18px, 2vw, 30px); }
    .identity img { width: 56px; height: 56px; object-fit: contain; }
    .reference { margin: 2vh 0 1vh; color: #dccb83; font-size: clamp(20px, 2vw, 32px); }
    #ayah { font-size: clamp(44px, 7.4vw, 104px); line-height: 1.9; text-wrap: balance; }
    #translation { color: #e8ddb5; font-size: clamp(23px, 3.4vw, 48px); line-height: 1.55; margin: 18px auto 0; max-width: 1200px; }
    .explanations { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 22px; margin-top: 34px; text-align: start; }
    .explanation { border: 1px solid #56705b; background: #10231bbf; border-radius: 22px; padding: 20px 24px; }
    .explanation h2 { color: #dccb83; font-size: 18px; margin: 0 0 10px; }
    .explanation p { font-size: clamp(18px, 2vw, 28px); line-height: 1.65; margin: 0; white-space: pre-wrap; }
    .footer { display: flex; align-items: end; justify-content: space-between; gap: 28px; border-top: 1px solid #526755; padding-top: 20px; color: #ddd8c1; }
    .location { font-size: clamp(20px, 2.2vw, 32px); color: #dccb83; }
    .prayers { display: flex; flex-wrap: wrap; justify-content: end; gap: 10px; }
    .prayer { min-width: 104px; background: #12291e; border: 1px solid #385342; border-radius: 15px; padding: 9px 14px; text-align: center; }
    .prayer span { display: block; color: #d9d3bf; font-size: 15px; }
    .prayer strong { font-size: 22px; font-variant-numeric: tabular-nums; }
    #player { position: absolute; inset: 0; width: 1px; height: 1px; opacity: .001; pointer-events: none; }
    #status { position: fixed; inset-inline-start: 20px; bottom: 14px; font: 13px sans-serif; color: #a7b2a7; }
    @media (orientation: portrait) {
      main { padding: 24px; }
      .footer { align-items: start; flex-direction: column; }
      .prayers { justify-content: start; }
      .prayer { min-width: 88px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="reading" aria-live="polite">
      <div class="identity"><img id="brand" alt=""><span id="reciter">القرآن الكريم</span></div>
      <div class="reference" id="reference">اختر جهاز العرض من تطبيق مسلم</div>
      <div id="ayah"></div>
      <div id="translation" dir="auto"></div>
      <div class="explanations" id="explanations"></div>
    </section>
    <footer class="footer">
      <div><div class="location" id="location"></div><div id="timezone"></div></div>
      <div class="prayers" id="prayers"></div>
    </footer>
  </main>
  <cast-media-player id="player"></cast-media-player>
  <div id="status" role="status"></div>
  <script>
    (() => {
      'use strict';
      const NAMESPACE = 'urn:x-cast:org.muslim.quran';
      const $ = (id) => document.getElementById(id);
      const player = $('player');
      let lastPayloadKey = '';
      const text = (element, value) => { element.textContent = value || ''; };
      const render = (payload) => {
        if (!payload || payload.schemaVersion !== 1) return;
        const key = `${payload.globalAyahNumber}:${payload.languageTag}`;
        if (key !== lastPayloadKey) {
          lastPayloadKey = key;
          document.documentElement.lang = payload.languageTag || 'ar';
          document.documentElement.dir = 'auto';
          text($('reference'), `سورة ${payload.surahNumber} · الآية ${payload.ayahNumber}`);
          text($('ayah'), payload.arabicAyah);
          $('translation').lang = payload.translation?.languageTag || payload.languageTag || 'ar';
          $('translation').dir = $('translation').lang.startsWith('ar') ? 'rtl' : 'auto';
          text($('translation'), payload.translation?.text);
          text($('reciter'), payload.reciterName);
          const explanations = $('explanations');
          explanations.replaceChildren();
          for (const item of payload.tafsir || []) {
            const article = document.createElement('article'); article.className = 'explanation';
            const heading = document.createElement('h2'); heading.textContent = item.languageTag?.startsWith('ar') ? 'التفسير · ' + item.source : 'Tafsir · ' + item.source;
            const paragraph = document.createElement('p'); paragraph.textContent = item.text; paragraph.lang = item.languageTag || 'und'; paragraph.dir = item.languageTag?.startsWith('ar') ? 'rtl' : 'auto';
            article.append(heading, paragraph); explanations.append(article);
          }
          if (payload.prayerLocation) {
            text($('location'), payload.prayerLocation.city);
            text($('timezone'), payload.prayerLocation.timeZoneId);
          }
          const prayers = $('prayers'); prayers.replaceChildren();
          const labels = (payload.languageTag || 'ar').startsWith('ar')
            ? { Fajr: 'الفجر', Dhuhr: 'الظهر', Asr: 'العصر', Maghrib: 'المغرب', Isha: 'العشاء' }
            : { Fajr: 'Fajr', Dhuhr: 'Dhuhr', Asr: 'Asr', Maghrib: 'Maghrib', Isha: 'Isha' };
          for (const item of payload.prayerTimes || []) {
            const cell = document.createElement('div'); cell.className = 'prayer';
            const name = document.createElement('span'); name.textContent = labels[item.name] || item.name;
            const time = document.createElement('strong'); time.textContent = item.localTime;
            cell.append(name, time); prayers.append(cell);
          }
        }
      };
      const context = cast.framework.CastReceiverContext.getInstance();
      const manager = context.getPlayerManager();
      context.addCustomMessageListener(NAMESPACE, (event) => {
        try { render(JSON.parse(event.data)); $('status').textContent = ''; }
        catch (_) { $('status').textContent = 'Invalid Quran display message'; }
      });
      manager.addEventListener(cast.framework.messages.EventType.MEDIA_STATUS, (event) => {
        const metadata = event.mediaStatus?.media?.metadata;
        if (!metadata) return;
        const data = metadata.quranPayload;
        if (data && typeof data === 'string') { try { render(JSON.parse(data)); } catch (_) {} }
        text($('reciter'), metadata.artist || $('reciter').textContent);
      });
      context.start({ receiverDisplayStatus: { statusText: 'Quran recitation' } });
      $('status').textContent = 'Waiting for Muslim app';
    })();
  </script>
</body>
</html>
