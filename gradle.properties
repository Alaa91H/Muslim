# JVM memory for the Gradle daemon. Locale is pinned to en_US so code
# generators (Room/KSP) never emit localized digits (Arabic-Indic numerals
# are invalid Kotlin literals when the OS locale is Arabic).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -XX:+UseParallelGC

# Parallel builds across modules
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX (default true in AGP 9, kept explicit for clarity)
android.useAndroidX=true

# Non-transitive R classes (per-module R, default in AGP 9)
android.nonTransitiveRClass=true

# Kotlin code style
kotlin.code.style=official

# The Kotlin daemon (which hosts KSP) must also see en_US, otherwise Room's
# code generator emits Arabic-Indic digit literals on Arabic-locale machines.
kotlin.daemon.jvmargs=-Xmx2048m -Duser.language=en -Duser.country=US

# AGP 9.3 built-in Kotlin disallows external plugins from registering Kotlin
# sources via kotlin.sourceSets. KSP (2.2.10-2.0.2) still registers its generated
# output that way, so we keep the compatibility flag on. Revisit when a KSP
# release with native built-in-Kotlin support is used (and before AGP 10).
android.disallowKotlinSourceSets=false
