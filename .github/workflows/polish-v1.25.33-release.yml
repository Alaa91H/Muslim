name: Polish Muslim v1.25.33 release assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-v1.25.33-release.yml'

permissions:
  contents: write

jobs:
  polish:
    name: Normalize v1.25.33 release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Normalize AAB name and refresh release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.25.33"
          mkdir -p /tmp/muslim-release
          gh release download "$TAG" --pattern "app-release.aab" --dir /tmp/muslim-release
          test -s /tmp/muslim-release/app-release.aab
          cp /tmp/muslim-release/app-release.aab /tmp/muslim-release/app-production-release.aab
          gh release upload "$TAG" /tmp/muslim-release/app-production-release.aab --clobber
          gh release delete-asset "$TAG" "app-release.aab" --yes
          gh release edit "$TAG" --notes-file docs/releases/v1.25.33.md
          gh release view "$TAG" --json url,tagName,name,isDraft,isPrerelease,assets
