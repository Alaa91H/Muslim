name: Cleanup merged branches

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete verified merged branches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Delete merged branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'feat/appearance-amoled-v4'
            'feat/appearance-ornaments-v2'
            'feat/appearance-palettes-v3'
            'feat/family-life-foundation'
            'feat/family-life-hub-and-guides'
            'feat/family-life-library-daily-kinship'
            'feat/family-life-parenting-newborn-ruqyah'
            'feat/family-life-reader-polish'
            'feat/history-civilization-foundation'
            'feat/reference-aqeedah-quran-hadith-sciences-v2'
            'feat/reference-aqeedah-quran-hadith-sciences-v3'
            'feat/reference-companions-household-v1'
            'feat/reference-companions-household-v2'
            'feat/reference-ethics-muslim-life-v2'
            'feat/reference-faq-misconceptions-v2'
            'feat/reference-fiqh-worship-v2'
            'feat/reference-fiqh-worship-v3'
            'feat/reference-history-civilization-v2'
            'feat/reference-intro-asset-v2'
            'feat/reference-library-architecture-v2'
            'feat/reference-places-glossary-v2'
            'feat/reference-prophets-comprehensive-v2'
            'feat/reference-reader-polish-v2'
            'feat/scholar-library-v2-foundation'
            'feat/scholar-library-v3-curricula'
            'feat/scholar-library-v4-hierarchy-plans'
            'feat/scholar-library-v5-study-sessions'
            'feat/scholar-library-v6-review-mastery'
            'feat/scholar-library-v7-review-center'
            'feat/scholar-library-v8-package-backup'
            'feat/update-system-v2'
            'feat/update-system-v3-download-flow'
            'feat/update-system-v4-release-metadata'
            'feat/update-system-v6-ux-controls'
            'feature/adhkar-phase2-polish'
            'feature/adhkar-phase3-library-reader'
            'feature/funeral-will-expansion'
            'feature/tasbih-foundation-phase1'
            'fix/adhkar-datastore-singleton'
            'fix/wear-connection-nexaflow-parity'
            'refactor/update-system-v5-injection'
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

          remaining=0
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "::error::Branch still exists: $branch"
              remaining=1
            fi
          done
          exit "$remaining"
