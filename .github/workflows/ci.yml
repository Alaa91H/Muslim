name: CI

# Runs on every pull request and every push to main (and on v* tags, which
# trigger the release build). PRs must pass both the `quality` and
# `emulator-tests` jobs before they can merge.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  # write is required by the release-apk job to publish tag releases.
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate (fast, no emulator): the checks that must be green before any
  # merge. Building the debug APK catches resource/manifest breakage, the unit
  # tests catch logic regressions, Android lint catches API/resource problems
  # and Detekt catches code smells. One job keeps the slow pieces together so
  # a PR only waits once.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality (build · unit · lint · detekt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Gradle dependency + build caches shared across runs (and across the
      # emulator job below via the same cache). Speeds CI up and never touches
      # the source tree.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Verify bundled-content inventory
        run: |
          python3 scripts/generate_content_manifest.py
          python3 scripts/verify_content_manifest.py
          git diff --exit-code -- docs/content/content_manifest.json

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :wear:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      # Static analysis gate. Rule set: config/detekt/detekt.yml; current
      # findings are pinned in config/detekt/detekt-baseline.xml so the gate
      # fails only on NEW violations instead of demanding a one-off rewrite.
      - name: Run Detekt
        run: ./gradlew detekt

      # When anything above fails, keep the diagnostics so the failure can be
      # diagnosed from CI without a local reproduction: test XMLs, lint and
      # Detekt reports, and the debug APK (for on-device triage).
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/lint-results-debug.*
            **/build/reports/detekt/*
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Device tests: real Compose UI instrumentation tests on an Android emulator
  # for the critical prayer home screen (feature-prayer-times). Kept in its
  # own job so emulator boot time does not delay the fast gate, but it is a
  # hard requirement — no continue-on-error — so a broken critical path can
  # never merge.
  # ---------------------------------------------------------------------------
  emulator-tests:
    name: Emulator tests (prayer home)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # The emulator runner needs /dev/kvm (nested virtualization) on Linux
      # hosts. Without it the emulator falls back to pure software emulation
      # and never boots within the 10-minute timeout (adb never connects),
      # which is exactly what we saw on the first runs. This udev rule makes
      # KVM world-accessible to the runner user.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest :feature:feature-prayer-times:connectedDebugAndroidTest

      # Instrumentation failures are the hardest to reproduce locally, so the
      # device test report is always kept when this job fails.
      - name: Upload device test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-reports
          path: |
            **/build/outputs/androidTest-results/**/*.xml
            **/build/reports/androidTests/**
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Closed beta: emits a signed update APK for the main Muslim package only
  # after unit, lint, and emulator gates pass on main. This
  # artifact is for invited testers, not a public release or production approval.
  # ---------------------------------------------------------------------------
  beta-apk:
    name: Closed beta APK
    runs-on: ubuntu-latest
    needs: [quality, emulator-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Check closed beta signing configuration
        id: signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Closed beta artifact skipped: configure all SIGNING_* secrets to enable updatable tester builds."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build updatable closed beta APK
        if: steps.signing.outputs.configured == 'true'
        run: ./gradlew :app:assembleClosedBeta --stacktrace
        env:
          # Override the nearest production tag so the beta versionCode is
          # higher than v1.24.0 and therefore installs as an in-place update.
          VERSION_TAG: ${{ vars.BETA_VERSION_TAG || '1.24.1' }}
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Assemble tester pack
        if: steps.signing.outputs.configured == 'true'
        run: |
          mkdir -p beta-tester-pack
          cp app/build/outputs/apk/beta/*.apk beta-tester-pack/Muslim-update-beta.apk
          cp docs/qa/beta_tester_guide.md beta-tester-pack/README.md
          cp docs/content/content_manifest.json beta-tester-pack/content_manifest.json
          printf 'commit=%s\nworkflow=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > beta-tester-pack/build-info.txt

      - name: Upload closed beta tester pack
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: muslim-closed-beta-${{ github.sha }}
          path: beta-tester-pack/
          retention-days: 30
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release artifacts: only for main pushes and v* tags (PRs never build them).
  # A tag is treated as a production candidate: it must pass the explicit
  # signing and approved-content gates before any artifact is published.
  # ---------------------------------------------------------------------------
  release-apk:
    name: Release artifacts (APK + AAB)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # A v* tag is a production candidate, not merely a convenient APK build.
      # It must have a stable signing identity and no unapproved bundled content.
      - name: Verify production release gates
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew :app:verifyProductionRelease --stacktrace
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Build signed release APK and App Bundle
        run: |
          if [ -z "$SIGNING_KEYSTORE" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "::error::Production tag cannot use a debug signing key. Configure SIGNING_* secrets."
              exit 1
            fi
            echo "::warning::No production signing key on this main build; artifacts are internal-only."
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ./gradlew :app:assembleRelease :app:bundleProductionRelease :wear:assembleRelease --stacktrace
          else
            ./gradlew :app:assembleRelease :app:bundleRelease :wear:assembleRelease --stacktrace
          fi
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: muslim-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            wear/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Fully automatic publishing: creating a v* tag builds the signed APK
      # here (fast GitHub→GitHub network) and this step creates the release,
      # attaches the APK and publishes it — no manual intervention needed.
      - name: Publish GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          PREV="$(git describe --tags --match 'v*' --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            CHANGELOG="$(git log --oneline --no-decorate "$PREV..$TAG" | sed 's/^/- /' | head -60 || true)"
          else
            CHANGELOG="- Initial release."
          fi
          PHONE_APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          WEAR_APK="$(find wear/build/outputs/apk/release -name '*.apk' | head -1)"
          [ -n "$PHONE_APK" ] || { echo "No phone release APK found" >&2; exit 1; }
          [ -n "$WEAR_APK" ] || { echo "No Wear OS release APK found" >&2; exit 1; }
          NOTES="$(printf '%b' "## Muslim $TAG\n\nBuilt automatically from the $TAG tag by GitHub Actions. The in-app version matches exactly and the stable signing key lets users update over existing installs.\n\n### Changes since $PREV\n$CHANGELOG\n\n### Install\n- Download the APK and open it (allow install from unknown sources if prompted).\n\n### Support\n- GitHub: https://github.com/Alaa91H\n- Email: alahus2591@gmail.com\n- Telegram: https://t.me/Alaa91h\n- Ko-fi: https://ko-fi.com/alaa91h")"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Muslim $TAG" --notes "$NOTES" --draft
          fi
          gh release upload "$TAG" "$PHONE_APK" "$WEAR_APK" --clobber
          gh release edit "$TAG" --draft=false
          echo "Published https://github.com/${{ github.repository }}/releases/tag/$TAG"
