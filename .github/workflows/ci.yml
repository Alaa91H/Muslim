name: CI

# One workflow builds signed APKs for CI runs. Only a validated vX.Y.Z tag is
# allowed to publish a GitHub Release, and release assets are APKs only.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate (fast, no emulator): the checks that must be green before any
  # merge. Building the debug APK catches resource/manifest breakage, the unit
  # tests catch logic regressions, Android lint catches API/resource problems
  # and Detekt catches code smells. One job keeps the slow pieces together so
  # a PR only waits once.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality (build · unit · lint · detekt)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Gradle dependency + build caches shared across runs (and across the
      # emulator job below via the same cache). Speeds CI up and never touches
      # the source tree.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Verify visual comparison policies
        run: |
          python3 -m pip install -r scripts/requirements-uiux-visual.txt
          python3 -m unittest discover -s scripts/tests -p test_uiux_v2_visual_comparison.py -v

      - name: Verify changed localization quality
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          python3 -m unittest discover -s scripts/tests -p test_localize.py -v
          python3 -m unittest discover -s scripts/tests -p test_localization_diff.py -v
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [ -n "$PUSH_BASE_SHA" ] && [[ ! "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$PUSH_BASE_SHA"
          else
            BASE_SHA="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          python3 scripts/check_localization_diff.py "$BASE_SHA"

      - name: Verify feature module boundaries
        run: python3 scripts/verify_module_boundaries.py

      - name: Verify Wear / IoT integration
        run: python3 scripts/verify_iot_integration.py

      - name: Verify bundled-content inventory
        run: |
          python3 scripts/generate_content_manifest.py
          python3 scripts/verify_content_manifest.py
          python3 scripts/verify_reference_library_assets.py
          git diff --exit-code -- docs/content/content_manifest.json

      - name: Audit Quran text pack catalogue and language coverage
        run: python3 scripts/verify_quran_text_packs.py

      - name: Require complete religious-text coverage for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/verify_quran_text_packs.py --release

      - name: Verify product identity and Adhan notification lifecycle
        run: |
          python3 scripts/verify_islamic_visual_identity.py
          python3 scripts/verify_accessibility.py
          python3 scripts/verify_adhan_notification_lifecycle.py
          python3 scripts/verify_prayer_calculation_integrity.py
          python3 scripts/verify_hadith_paging_and_navigation.py
          python3 scripts/verify_hadith_chapter_localization.py
          python3 scripts/verify_prayer_location_notification_contract.py
          python3 scripts/verify_nearby_mosques_contract.py
          python3 scripts/verify_qibla_v2.py
          python3 scripts/verify_funeral_will.py
          python3 scripts/verify_responsive_customization_layout.py
          python3 scripts/verify_design_system_adoption.py
          python3 scripts/verify_quran_playback_reliability.py
          python3 scripts/verify_quran_reader_v2.py
          python3 scripts/verify_quran_library_v2.py
          python3 scripts/verify_quran_session_restore.py
          python3 scripts/verify_home_uiux_contract.py
          python3 scripts/verify_uiux_v2_feature_parity.py
          python3 scripts/verify_uiux_v2_qa_matrix.py
          python3 scripts/verify_ci_apk_release.py
          python3 scripts/verify_more_hub_v2.py
          python3 scripts/verify_adhkar_tasbih_v2.py
          python3 scripts/verify_scholar_library.py
          git diff --check

      - name: Verify Family Life feature
        run: python3 scripts/verify_family_life.py

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Smoke-test update manifest generator
        run: |
          set -euo pipefail
          PHONE_APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          [ -n "$PHONE_APK" ] || { echo "No debug phone APK found" >&2; exit 1; }
          bash scripts/generate-update-manifest.sh "$PHONE_APK" /tmp/update-manifest.json debug debug
          python3 -m json.tool /tmp/update-manifest.json >/dev/null

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :wear:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      # Static analysis gate. Rule set: config/detekt/detekt.yml; current
      # findings are pinned in config/detekt/detekt-baseline.xml so the gate
      # fails only on NEW violations instead of demanding a one-off rewrite.
      - name: Run Detekt
        run: ./gradlew detekt

      # When anything above fails, keep the diagnostics so the failure can be
      # diagnosed from CI without a local reproduction: test XMLs, lint and
      # Detekt reports, and the debug APK (for on-device triage).
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/lint-results-debug.*
            **/build/reports/detekt/*
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Device tests: real Compose UI instrumentation tests on an Android emulator
  # for the critical prayer home and Qibla/Nearby Mosques flows. Kept in its
  # own job so emulator boot time does not delay the fast gate, but it is a
  # hard requirement — no continue-on-error — so a broken critical path can
  # never merge.
  # ---------------------------------------------------------------------------
  emulator-tests:
    name: Emulator tests (prayer home + Qibla mosques · API ${{ matrix.api-level }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # The emulator runner needs /dev/kvm (nested virtualization) on Linux
      # hosts. Without it the emulator falls back to pure software emulation
      # and never boots within the 10-minute timeout (adb never connects),
      # which is exactly what we saw on the first runs. This udev rule makes
      # KVM world-accessible to the runner user.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 26 covers the app's minimum supported Android generation, while
          # API 36 exercises current background-audio and notification restrictions.
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          # Preserve android-emulator-runner defaults and explicitly opt out of
          # emulator metrics so modern emulator builds never block CI for consent.
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: |
            bash scripts/capture_uiux_v2_artifacts.sh
            python3 scripts/validate_uiux_v2_screenshots.py artifacts/uiux-v2
            ./gradlew :feature:feature-scholar-library:connectedDebugAndroidTest
            adb shell cmd audio set-enable-hardening throw
            ./gradlew :feature:feature-learn:connectedDebugAndroidTest :feature:feature-prayer-times:connectedDebugAndroidTest :feature:feature-qibla:connectedDebugAndroidTest :core:core-location:connectedDebugAndroidTest

      - name: Upload UI/UX V2 emulator screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uiux-v2-screenshots-api-${{ matrix.api-level }}
          path: artifacts/uiux-v2/*.png
          if-no-files-found: error

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-diagnostics-api-${{ matrix.api-level }}
          path: artifacts/emulator-diagnostics/
          if-no-files-found: ignore

      # Instrumentation failures are the hardest to reproduce locally, so the
      # device test report is always kept when this job fails.
      - name: Upload device test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-reports-api-${{ matrix.api-level }}
          path: |
            **/build/outputs/androidTest-results/**/*.xml
            **/build/reports/androidTests/**
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Critical Family Life UI instrumentation matrix.
  # ---------------------------------------------------------------------------
  family-life-emulator-tests:
    name: Family Life emulator tests · API ${{ matrix.api-level }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run Family Life instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          # Preserve android-emulator-runner defaults and explicitly opt out of
          # emulator metrics so modern emulator builds never block CI for consent.
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: ./gradlew :feature:feature-family-life:connectedDebugAndroidTest


  # Builds APKs on all validated runs. Non-tag APKs are private, short-lived
  # workflow artifacts; public GitHub Release assets are created by the tag-only
  # job below after the production gates pass.
  build-apks:
    name: Build and sign APKs
    runs-on: ubuntu-26.04
    needs: [quality, emulator-tests, family-life-emulator-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH (for example v1.25.38)."
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::A release tag must point to a commit already merged into main."
            exit 1
          }

      - name: Build tag release APKs with production signing
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew :app:verifyProductionRelease :app:assembleRelease :wear:assembleRelease --stacktrace
        env:
          VERSION_TAG: ${{ github.ref_name }}
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Build signed development APKs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Verify signatures and stage APK files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-apks
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          [ -x "$APKSIGNER" ] || { echo "::error::Android apksigner not found"; exit 1; }

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            PHONE_SOURCE="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
            WEAR_SOURCE="$(find wear/build/outputs/apk/release -type f -name '*.apk' | head -1)"
            cp "$PHONE_SOURCE" "ci-apks/Muslim-${GITHUB_REF_NAME}.apk"
            cp "$WEAR_SOURCE" "ci-apks/Muslim-Wear-${GITHUB_REF_NAME}.apk"
          else
            PHONE_SOURCE="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
            WEAR_SOURCE="$(find wear/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
            cp "$PHONE_SOURCE" ci-apks/Muslim-development.apk
            cp "$WEAR_SOURCE" ci-apks/Muslim-Wear-development.apk
          fi

          for APK in ci-apks/*.apk; do
            [ -s "$APK" ] || { echo "::error::Missing APK: $APK"; exit 1; }
            CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
            if [[ "$GITHUB_REF" == refs/tags/* ]] && grep -qi 'Android Debug' <<< "$CERTS"; then
              echo "::error::Production APK is signed with the Android debug key: $APK"
              exit 1
            fi
            echo "Verified signed APK: $(basename "$APK")"
          done

      - name: Store CI APKs for this run
        uses: actions/upload-artifact@v7
        with:
          name: muslim-apks-${{ github.run_id }}
          path: ci-apks/*.apk
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  # This is the only job with release-write permission. It runs exclusively for
  # a vX.Y.Z tag push after quality and both emulator matrices have succeeded.
  publish-release:
    name: Publish tagged APK release
    runs-on: ubuntu-26.04
    needs: [build-apks]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout tagged sources and changelog
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Android SDK for release signature verification
        uses: android-actions/setup-android@v4

      - name: Download signed APKs
        uses: actions/download-artifact@v7
        with:
          name: muslim-apks-${{ github.run_id }}
          path: release-apks

      - name: Prepare English release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## Muslim {tag}"
          start = changelog.find(heading)
          if start < 0:
              raise SystemExit(f"Missing {heading} section in CHANGELOG.md")
          end = re.search(r"^## Muslim v", changelog[start + len(heading):], re.MULTILINE)
          section_end = start + len(heading) + end.start() if end else len(changelog)
          section = changelog[start + len(heading):section_end].strip()
          if not section:
              raise SystemExit(f"The {heading} section is empty")
          notes = (
              f"# Muslim {tag}\n\n"
              f"Built from the validated `{tag}` tag. The Android app version is derived from this tag.\n\n"
              f"{section}\n"
          )
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Publish only APK assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          PHONE_APK="release-apks/Muslim-${TAG}.apk"
          WEAR_APK="release-apks/Muslim-Wear-${TAG}.apk"
          [ -s "$PHONE_APK" ] || { echo "::error::Phone APK is missing"; exit 1; }
          [ -s "$WEAR_APK" ] || { echo "::error::Wear APK is missing"; exit 1; }
          mapfile -t LOCAL_ASSETS < <(find release-apks -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t EXPECTED_ASSETS < <(printf '%s\n' "Muslim-${TAG}.apk" "Muslim-Wear-${TAG}.apk" | sort)
          if [[ "${LOCAL_ASSETS[*]}" != "$(printf '%s ' "${EXPECTED_ASSETS[@]}" | sed 's/ $//')" ]]; then
            echo "::error::Release staging must contain exactly the two APK files."
            printf 'Found: %s\n' "${LOCAL_ASSETS[@]}"
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          for APK in "$PHONE_APK" "$WEAR_APK"; do
            CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
            if grep -qi 'Android Debug' <<< "$CERTS"; then
              echo "::error::Refusing to publish a debug-signed APK: $APK"
              exit 1
            fi
          done

          # Drafts can be safely resumed after interrupted uploads. Published
          # releases are immutable here; use a new version tag for corrections.
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG is already published; create a new version tag for a correction."
              exit 1
            fi
            mapfile -t OLD_ASSETS < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            for ASSET in "${OLD_ASSETS[@]}"; do
              gh release delete-asset "$TAG" "$ASSET" --yes
            done
            gh release edit "$TAG" --title "Muslim $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "Muslim $TAG" --notes-file release-notes.md
          fi

          gh release upload "$TAG" "$PHONE_APK" "$WEAR_APK" --clobber
          mapfile -t REMOTE_ASSETS < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          if [[ "${REMOTE_ASSETS[*]}" != "${EXPECTED_ASSETS[*]}" ]]; then
            echo "::error::Release contains unexpected assets; publishing is blocked."
            printf 'Found: %s\n' "${REMOTE_ASSETS[@]}"
            exit 1
          fi
          for APK in "$PHONE_APK" "$WEAR_APK"; do
            NAME="$(basename "$APK")"
            LOCAL_SIZE="$(stat -c %s "$APK")"
            REMOTE_SIZE="$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name == \"$NAME\") | .size")"
            [ "$LOCAL_SIZE" = "$REMOTE_SIZE" ] || {
              echo "::error::Uploaded APK size does not match: $NAME"
              exit 1
            }
          done

          gh release edit "$TAG" --draft=false
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

